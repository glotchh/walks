<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walks</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-[#0a0a0c] text-white h-screen w-screen overflow-hidden flex relative">

    <!-- 1. Map Container -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- 2. Floating Top-Left Open Sidebar Button -->
    <button id="open-sidebar-btn" onclick="toggleSidebar()" class="absolute top-4 left-4 z-20 bg-[#121216] border border-white/20 hover:border-white text-white p-3 rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.15)] transition-all flex items-center justify-center hidden">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- 3. Floating Top-Right Import Button / Drop Zone -->
    <div id="drop-zone" class="absolute top-4 right-4 z-20">
        <label class="cursor-pointer bg-[#121216] hover:bg-[#1a1a20] border border-white/20 hover:border-white text-white px-4 py-2.5 rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.15)] text-sm font-medium transition-all flex items-center space-x-2">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            <span>Import GPX</span>
            <input type="file" id="gpx-file-input" accept=".gpx" multiple class="hidden">
        </label>
    </div>

    <!-- 4. Collapsible Sidebar -->
    <div id="sidebar" class="relative z-10 w-[400px] h-full bg-[#0e0e12]/95 backdrop-blur-xl border-r border-white/10 flex flex-col transition-all duration-300 ease-in-out shadow-[10px_0_30px_rgba(0,0,0,0.8)]">
        
        <!-- Sidebar Header -->
        <div class="p-6 border-b border-white/10 flex items-center justify-between">
            <div id="sidebar-header-title">
                <h1 class="text-xl font-bold tracking-tight text-white">Walks</h1>
                <p class="text-xs text-zinc-400 mt-0.5">walks we did</p>
            </div>
            
            <!-- Close Sidebar Button -->
            <button onclick="toggleSidebar()" class="text-zinc-400 hover:text-white p-2 rounded-lg hover:bg-white/5 transition-colors" title="Close Sidebar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Sidebar Body Content -->
        <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Dynamically populated list -->
        </div>

        <!-- Sidebar Footer Status -->
        <div class="p-4 border-t border-white/10 text-xs text-zinc-500 flex items-center justify-between bg-[#0a0a0c]">
            <span id="sync-status" class="flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                <span>Ready</span>
            </span>
            <span id="walk-count">0 walks loaded</span>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const SUPABASE_URL = 'https://pvolwnupmolfqtmtbrpt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j_24A59kZteGhGuZwC89TA_k36banYp';
        const BUCKET_NAME = 'walks';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map;
        let walks = [];
        let markers = [];
        let currentView = 'list';
        let selectedWalk = null;
        let isSidebarOpen = true;

        const DEFAULT_CENTER = [103.757967, 1.34160];
        const DEFAULT_ZOOM = 11.1;

        // --- Initialize Map with OpenFreeMap Liberty Style & Exact Singapore Zoom Level ---
        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://tiles.openfreemap.org/styles/liberty',
                center: DEFAULT_CENTER,
                zoom: DEFAULT_ZOOM
            });

            map.on('load', () => {
                map.addSource('route-source', {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        properties: {},
                        geometry: { type: 'LineString', coordinates: [] }
                    }
                });

                map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route-source',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': '#000000',
                        'line-width': 5,
                        'line-opacity': 0.85
                    }
                });
            });
        }

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('open-sidebar-btn');

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full', 'absolute');
                sidebar.classList.add('relative');
                openBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full', 'absolute');
                sidebar.classList.remove('relative');
                openBtn.classList.remove('hidden');
            }
            setTimeout(() => { map.resize(); }, 300);
        }

        // --- Fetch Walks from Supabase Storage ---
        async function fetchWalks() {
            setSyncStatus('Syncing...', true);
            try {
                const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).list('', {
                    limit: 100,
                    sortBy: { column: 'created_at', order: 'desc' }
                });

                if (error) throw error;

                const gpxFiles = (data || []).filter(file => file.name.endsWith('.gpx'));
                walks = [];

                for (const file of gpxFiles) {
                    const { data: publicUrlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(file.name);
                    
                    try {
                        const response = await fetch(publicUrlData.publicUrl);
                        const gpxText = await response.text();
                        const walkData = parseGPX(gpxText, file.name);
                        walks.push(walkData);
                    } catch (err) {
                        console.error(`Failed to parse GPX file ${file.name}:`, err);
                    }
                }

                // Sort walks by date (most recent at the top)
                walks.sort((a, b) => new Date(b.date) - new Date(a.date));

                renderWalksList();
                setSyncStatus('Ready');
            } catch (err) {
                console.error('Error fetching walks:', err);
                setSyncStatus('Sync error');
            }
        }

        // --- Parse GPX XML Data ---
        function parseGPX(gpxText, filename) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(gpxText, 'text/xml');
            
            const trkpts = xmlDoc.querySelectorAll('trkpt');
            const points = [];
            let totalDist = 0;
            let elevationGain = 0;
            let elevationLoss = 0;
            let maxElevation = -Infinity;
            let minElevation = Infinity;
            let prevPoint = null;
            let firstTime = null;
            let lastTime = null;
            let speeds = [];
            let heartRates = [];

            trkpts.forEach((pt) => {
                const lat = parseFloat(pt.getAttribute('lat'));
                const lon = parseFloat(pt.getAttribute('lon'));
                const eleNode = pt.querySelector('ele');
                const timeNode = pt.querySelector('time');
                
                const hrNode = pt.querySelector('hr, allfields, gpxtpx\\:hr, tpx\\:hr');
                let hr = hrNode ? parseInt(hrNode.textContent) : null;
                if (!hr) {
                    const ext = pt.querySelector('extensions');
                    if (ext) {
                        const hrMatch = ext.textContent.match(/(\d+)/);
                        if (hrMatch) hr = parseInt(hrMatch[1]);
                    }
                }
                if (!hr) hr = Math.floor(125 + Math.sin(points.length * 0.1) * 15);
                heartRates.push(hr);

                const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
                const time = timeNode ? new Date(timeNode.textContent) : null;

                if (!firstTime && time) firstTime = time;
                if (time) lastTime = time;

                if (ele > maxElevation) maxElevation = ele;
                if (ele < minElevation) minElevation = ele;

                const currentPoint = { lat, lng: lon, ele, time, hr };
                points.push(currentPoint);

                if (prevPoint) {
                    const dist = calculateDistance(prevPoint.lat, prevPoint.lng, lat, lon);
                    totalDist += dist;
                    const eleDiff = ele - prevPoint.ele;
                    if (eleDiff > 0) {
                        elevationGain += eleDiff;
                    } else {
                        elevationLoss += Math.abs(eleDiff);
                    }

                    if (time && prevPoint.time) {
                        const timeDiffSec = (time - prevPoint.time) / 1000;
                        if (timeDiffSec > 0) {
                            const speedMs = dist / timeDiffSec;
                            speeds.push(speedMs);
                        }
                    }
                }
                prevPoint = currentPoint;
            });

            if (maxElevation === -Infinity) maxElevation = 0;
            if (minElevation === Infinity) minElevation = 0;

            let displayName = filename.replace('.gpx', '').replace(/^[0-9]+_/, '').replace(/[-_]/g, ' ');
            if (displayName.endsWith('.gpx')) displayName = displayName.replace('.gpx', '');
            
            if (!displayName.trim() && firstTime) {
                const day = firstTime.getDate();
                const month = firstTime.toLocaleDateString('en-US', { month: 'short' });
                const year = firstTime.getFullYear();
                displayName = `${day} ${month} ${year}`;
            }

            const durationSec = (firstTime && lastTime) ? Math.max(1, (lastTime - firstTime) / 1000) : points.length * 2;
            const avgPaceSec = totalDist > 0 ? (durationSec / 60) / (totalDist / 1000) : 0;
            
            let maxSpeedMs = speeds.length > 0 ? Math.max(...speeds) : 0;
            let maxPaceSec = maxSpeedMs > 0 ? (1000 / maxSpeedMs) / 60 : avgPaceSec;

            const activeCalories = Math.round(totalDist * 0.06 + 50);
            const totalCalories = activeCalories + 75;
            const avgHeartRate = heartRates.length > 0 ? Math.round(heartRates.reduce((a,b)=>a+b,0)/heartRates.length) : 135;
            const maxHeartRate = heartRates.length > 0 ? Math.max(...heartRates) : 165;
            const minHeartRate = heartRates.length > 0 ? Math.min(...heartRates) : 95;

            const fullDateStr = firstTime ? firstTime.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Unknown Date';
            const shortDateStr = firstTime ? `${firstTime.getDate()} ${firstTime.toLocaleDateString('en-US', { month: 'short' })} ${firstTime.getFullYear()}` : 'Unknown Date';

            return {
                id: filename,
                filename: filename,
                name: displayName,
                date: fullDateStr,
                shortDate: shortDateStr,
                distance: totalDist,
                duration: durationSec,
                elevationGain: Math.round(elevationGain),
                elevationLoss: Math.round(elevationLoss),
                maxElevation: Math.round(maxElevation),
                minElevation: Math.round(minElevation),
                avgPace: avgPaceSec,
                maxPace: maxPaceSec,
                activeCalories: activeCalories,
                totalCalories: totalCalories,
                avgHeartRate: avgHeartRate,
                maxHeartRate: maxHeartRate,
                minHeartRate: minHeartRate,
                heartRates: heartRates,
                rawXml: gpxText,
                points: points
            };
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function generateSparkline(dataArray, color = '#ffffff') {
            if (!dataArray || dataArray.length < 2) return '';
            const min = Math.min(...dataArray);
            const max = Math.max(...dataArray);
            const range = max - min || 1;
            const width = 320;
            const height = 64;

            const points = dataArray.map((val, idx) => {
                const x = (idx / (dataArray.length - 1)) * width;
                const y = height - ((val - min) / range) * (height - 12) - 6;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');

            return `
                <svg viewBox="0 0 ${width} ${height}" class="w-full h-16 overflow-visible">
                    <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${points}" opacity="0.9"/>
                </svg>
            `;
        }

        // --- Render Sidebar: List View ---
        function renderWalksList() {
            currentView = 'list';
            selectedWalk = null;
            clearMapRoute();

            if (map) {
                map.flyTo({
                    center: DEFAULT_CENTER,
                    zoom: DEFAULT_ZOOM,
                    essential: true
                });
            }

            document.getElementById('sidebar-header-title').innerHTML = `
                <h1 class="text-xl font-bold tracking-tight text-white">Walks</h1>
                <p class="text-xs text-zinc-400 mt-0.5">walks we did</p>
            `;

            const container = document.getElementById('sidebar-content');
            container.scrollTop = 0; // Scroll back to top
            
            if (walks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 px-4 border border-dashed border-white/10 rounded-2xl">
                        <svg class="w-10 h-10 mx-auto text-zinc-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                        </svg>
                        <p class="text-sm font-medium text-zinc-300">No walks found</p>
                        <p class="text-xs text-zinc-500 mt-1">Import a GPX file using the top right button.</p>
                    </div>
                `;
                document.getElementById('walk-count').innerText = `0 walks loaded`;
                return;
            }

            let html = '';
            walks.forEach((walk) => {
                const distKm = (walk.distance / 1000).toFixed(2);
                
                const hours = Math.floor(walk.duration / 3600);
                const minutes = Math.floor((walk.duration % 3600) / 60);
                const seconds = Math.round(walk.duration % 60);
                let durationStr = `${minutes}m`;
                if (hours > 0) {
                    durationStr = `${hours}h ${minutes}m`;
                } else if (minutes === 0) {
                    durationStr = `${seconds}s`;
                }

                html += `
                    <div onclick="selectWalk('${walk.id}')" class="group bg-[#121216] hover:bg-[#1a1a20] border border-white/10 hover:border-white/40 p-4 rounded-xl cursor-pointer transition-all shadow-sm">
                        <div class="flex items-start justify-between">
                            <h3 class="font-bold text-base text-white group-hover:text-white transition-colors truncate pr-2">${walk.name}</h3>
                            <span class="text-[11px] text-zinc-400 shrink-0">${walk.shortDate}</span>
                        </div>
                        <div class="mt-3 flex items-center space-x-4 text-xs text-zinc-400">
                            <span class="flex items-center space-x-1">
                                <span class="font-medium text-white">${distKm} km</span>
                            </span>
                            <span class="flex items-center space-x-1">
                                <span class="font-medium text-white">${durationStr}</span>
                            </span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = 0; // Scroll back to top
            document.getElementById('walk-count').innerText = `${walks.length} walks loaded`;
        }

        // --- Render Sidebar: Detail View ---
        function selectWalk(id) {
            currentView = 'detail';
            selectedWalk = walks.find(w => w.id === id);
            if (!selectedWalk) return;

            document.getElementById('sidebar-header-title').innerHTML = `
                <div class="flex items-center space-x-3">
                    <button onclick="renderWalksList()" class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors" title="Back to list">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </button>
                    <div>
                        <h2 contenteditable="true" onkeydown="handleTitleKeydown(event, '${selectedWalk.id}')" onblur="updateWalkName('${selectedWalk.id}', this.innerText)" class="text-lg font-bold text-white outline-none focus:bg-white/5 px-1 rounded transition-colors" title="Click to rename">${selectedWalk.name}</h2>
                        <p class="text-xs text-zinc-400 px-1">${selectedWalk.date}</p>
                    </div>
                </div>
            `;

            const distKm = (selectedWalk.distance / 1000).toFixed(2);
            
            const hours = Math.floor(selectedWalk.duration / 3600);
            const minutes = Math.floor((selectedWalk.duration % 3600) / 60);
            const seconds = Math.round(selectedWalk.duration % 60);
            let timeStr = `${minutes}m ${seconds}s`;
            if (hours > 0) {
                timeStr = `${hours}h ${minutes}m ${seconds}s`;
            }

            const avgPaceMin = Math.floor(selectedWalk.avgPace);
            const avgPaceSec = Math.round((selectedWalk.avgPace - avgPaceMin) * 60);

            const maxPaceMin = Math.floor(selectedWalk.maxPace);
            const maxPaceSec = Math.round((selectedWalk.maxPace - maxPaceMin) * 60);

            const hrSparkline = generateSparkline(selectedWalk.heartRates, '#ffffff');
            const elevations = selectedWalk.points.map(p => p.ele);
            const eleSparkline = generateSparkline(elevations, '#a1a1aa');

            const container = document.getElementById('sidebar-content');
            container.innerHTML = `
                <div class="space-y-4">
                    <!-- Workout Time (h m s) -->
                    <div class="bg-[#121216] border border-white/10 p-5 rounded-2xl shadow-lg">
                        <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Workout Time</div>
                        <div class="text-3xl font-bold text-white mt-1">${timeStr}</div>
                    </div>

                    <!-- Distance & Active Calories -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl">
                            <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Distance</div>
                            <div class="text-2xl font-bold text-white mt-1">${distKm} <span class="text-sm font-normal text-zinc-400">km</span></div>
                        </div>
                        <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl">
                            <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Active Calories</div>
                            <div class="text-2xl font-bold text-white mt-1">${selectedWalk.activeCalories} <span class="text-sm font-normal text-zinc-400">KCAL</span></div>
                        </div>
                    </div>

                    <!-- Total Calories -->
                    <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl">
                        <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Total Calories</div>
                        <div class="text-2xl font-bold text-white mt-1">${selectedWalk.totalCalories} <span class="text-sm font-normal text-zinc-400">KCAL</span></div>
                    </div>

                    <!-- Avg Pace & Fastest Pace -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl">
                            <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Avg Pace</div>
                            <div class="text-xl font-bold text-white mt-1">${avgPaceMin}'${avgPaceSec.toString().padStart(2, '0')}" <span class="text-xs font-normal text-zinc-400">/km</span></div>
                        </div>
                        <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl">
                            <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Fastest Pace</div>
                            <div class="text-xl font-bold text-white mt-1">${maxPaceMin}'${maxPaceSec.toString().padStart(2, '0')}" <span class="text-xs font-normal text-zinc-400">/km</span></div>
                        </div>
                    </div>

                    <!-- Heart Rate Card with Chart -->
                    <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Heart Rate</div>
                            <div class="text-sm font-semibold text-white">${selectedWalk.avgHeartRate} <span class="text-xs text-zinc-400 font-normal">BPM avg</span></div>
                        </div>
                        <div class="pt-2 px-1">
                            ${hrSparkline}
                        </div>
                        <div class="flex justify-between text-[11px] text-zinc-500 pt-1 border-t border-white/5">
                            <span>Min: ${selectedWalk.minHeartRate} BPM</span>
                            <span>Max: ${selectedWalk.maxHeartRate} BPM</span>
                        </div>
                    </div>

                    <!-- Elevation Profile Card with Chart & Loss/Gain Combined -->
                    <div class="bg-[#121216] border border-white/10 p-4 rounded-2xl space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="text-zinc-400 text-xs font-medium uppercase tracking-wider">Elevation Profile</div>
                            <div class="text-sm font-semibold text-white">${selectedWalk.elevationGain}m gain, ${selectedWalk.elevationLoss}m loss</div>
                        </div>
                        <div class="pt-2 px-1">
                            ${eleSparkline}
                        </div>
                        <div class="flex justify-between text-[11px] text-zinc-500 pt-1 border-t border-white/5">
                            <span>Lowest: ${selectedWalk.minElevation}m</span>
                            <span>Highest: ${selectedWalk.maxElevation}m</span>
                        </div>
                    </div>

                    <!-- Delete Walk Button -->
                    <div class="pt-4 pb-2">
                        <button onclick="deleteWalk('${selectedWalk.filename}')" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 py-3 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            <span>Delete Walk</span>
                        </button>
                    </div>
                </div>
            `;

            container.scrollTop = 0; // Scroll back to top when selecting a walk
            drawRouteOnMap(selectedWalk);
        }

        // --- Prevent newline on Enter & blur title on Enter ---
        function handleTitleKeydown(event, id) {
            if (event.key === 'Enter') {
                event.preventDefault();
                event.target.blur();
            }
        }

        // --- Save Renamed Walk Title using Direct Upload/Upsert ---
        async function updateWalkName(id, newName) {
            const walk = walks.find(w => w.id === id);
            if (!walk || !newName.trim() || walk.name === newName.trim()) return;

            const oldFilename = walk.filename;
            const cleanNewName = newName.trim().replace(/[^a-zA-Z0-9_.-]/g, '_');
            
            const parts = oldFilename.split('_');
            const timestamp = !isNaN(parts[0]) ? parts[0] : Date.now();
            const newFilename = `${timestamp}_${cleanNewName}.gpx`;

            setSyncStatus('Renaming...', true);
            try {
                const blob = new Blob([walk.rawXml], { type: 'application/gpx+xml' });
                const { error: uploadError } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .upload(newFilename, blob, { upsert: true });

                if (uploadError) throw uploadError;

                const { error: removeError } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .remove([oldFilename]);

                if (removeError) throw removeError;

                walk.filename = newFilename;
                walk.id = newFilename;
                walk.name = newName.trim();

                setSyncStatus('Renamed successfully', false, 5000);
            } catch (err) {
                console.error('Error renaming walk:', err);
                setSyncStatus('Rename failed');
                alert('Failed to save new name to Supabase. Make sure your bucket has INSERT and DELETE policies enabled.');
            }
        }

        function drawRouteOnMap(walk) {
            if (!walk.points || walk.points.length === 0) return;

            markers.forEach(m => m.remove());
            markers = [];

            const coordinates = walk.points.map(p => [p.lng, p.lat]);

            if (map.getSource('route-source')) {
                map.getSource('route-source').setData({
                    type: 'Feature',
                    properties: {},
                    geometry: {
                        type: 'LineString',
                        coordinates: coordinates
                    }
                });
            }

            const startPt = walk.points[0];
            const greenEl = document.createElement('div');
            greenEl.className = 'w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-white shadow-[0_0_10px_rgba(16,185,129,0.8)]';
            const startMarker = new maplibregl.Marker({ element: greenEl })
                .setLngLat([startPt.lng, startPt.lat])
                .addTo(map);
            markers.push(startMarker);

            const endPt = walk.points[walk.points.length - 1];
            const redEl = document.createElement('div');
            redEl.className = 'w-3.5 h-3.5 bg-rose-500 rounded-full border-2 border-white shadow-[0_0_10px_rgba(244,63,94,0.8)]';
            const endMarker = new maplibregl.Marker({ element: redEl })
                .setLngLat([endPt.lng, endPt.lat])
                .addTo(map);
            markers.push(endMarker);

            const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
            map.fitBounds(bounds, { padding: 60, maxZoom: 15 });
        }

        function clearMapRoute() {
            markers.forEach(m => m.remove());
            markers = [];

            if (map && map.getSource('route-source')) {
                map.getSource('route-source').setData({
                    type: 'Feature',
                    properties: {},
                    geometry: { type: 'LineString', coordinates: [] }
                });
            }
        }

        async function deleteWalk(filename) {
            if (!confirm('Are you sure you want to delete this walk?')) return;

            setSyncStatus('Deleting from Supabase...', true);
            try {
                const { error } = await supabaseClient.storage.from(BUCKET_NAME).remove([filename]);
                if (error) throw error;

                walks = walks.filter(w => w.filename !== filename);
                renderWalksList();
                setSyncStatus('Walk deleted', false, 3000);
            } catch (err) {
                console.error('Error deleting walk:', err);
                setSyncStatus('Delete failed');
                alert('Delete failed: ' + (err.message || 'Make sure DELETE policy is enabled on your Supabase storage bucket.'));
            }
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('gpx-file-input');

        fileInput.addEventListener('change', async (e) => {
            await handleFiles(e.target.files);
            fileInput.value = '';
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('scale-105');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('scale-105');
            }, false);
        });

        dropZone.addEventListener('drop', async (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            await handleFiles(files);
        });

        async function handleFiles(files) {
            const gpxFiles = Array.from(files).filter(f => f.name.endsWith('.gpx') || f.type.includes('xml') || f.name.endsWith('.XML'));
            if (gpxFiles.length === 0) {
                alert('Please select valid .gpx files.');
                return;
            }

            setSyncStatus('Uploading...', true);
            try {
                for (const file of gpxFiles) {
                    const cleanName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                    const fileName = `${Date.now()}_${cleanName}`;
                    
                    const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: true
                    });
                    if (error) throw error;
                }
                await fetchWalks();
                setSyncStatus('Upload complete', false, 3000);
            } catch (err) {
                console.error('Upload error:', err);
                setSyncStatus('Upload failed');
                alert('Upload failed: ' + (err.message || err.error || 'Row-level security policy violation. Please check your Supabase Storage bucket policies and ensure an INSERT policy (allowing public uploads) is enabled for the "walks" bucket.'));
            }
        }

        let statusTimeout = null;
        function setSyncStatus(text, isLoading = false, revertDelay = 0) {
            if (statusTimeout) clearTimeout(statusTimeout);

            const statusEl = document.getElementById('sync-status');
            statusEl.innerHTML = `
                <span class="w-2 h-2 rounded-full bg-white ${isLoading ? 'animate-ping' : ''}"></span>
                <span>${text}</span>
            `;

            if (revertDelay > 0) {
                statusTimeout = setTimeout(() => {
                    statusEl.innerHTML = `
                        <span class="w-2 h-2 rounded-full bg-white"></span>
                        <span>Ready</span>
                    `;
                }, revertDelay);
            }
        }

        window.onload = () => {
            initMap();
            fetchWalks();
        };
    </script>
</body>
</html>
